<script>
const tl = gsap.timeline({ paused: true });
// Plain class, never [data-composition-id=...]: a second mount of a component gets a renamed root, and the
// runtime scopes document queries to each mount (round-one lesson 1).
const R = document.querySelector(".tp");
const Q = function(s){ return R.querySelector(s); };
const QA = function(s){ return Array.prototype.slice.call(R.querySelectorAll(s)); };
const D = {"leftLabel": "YOU", "rightLabel": "THE NEXT GUY", "docTitle": "Written plan", "sentText": "Sent", "appLabel": "Messages", "timeLabel": "now", "callerName": "Customer", "callingText": "calling...", "clock": "9:41", "landAt": 0.9, "dur": 2.4, "top": 240, "centerX": 496, "scale": 1};
const VV = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
const V = function(k){ const x = VV[k]; return (x === undefined || x === null || x === '') ? D[k] : x; };
const N = function(k){ const x = Number(V(k)); return isFinite(x) ? x : Number(D[k]); };

const LP = Q('.pw.l'), RP = Q('.pw.r'), LPH = Q('.ph.l'), RPH = Q('.ph.r');
const LBY = Q('.lb.you'), LBN = Q('.lb.nxt'), LBF = Q('.lbf');
const NT = Q('.nt'), PG = Q('.pg'), SP = Q('.sp'), TK = Q('.sp path'), WK = Q('.wake');
const RG = QA('.rg'), OK = Q('.cb.ok'), CLT = Q('.clt'), CDS = QA('.cdot');
const L = Math.max(0.55, N('landAt'));
const DUR = N('dur');
const END = DUR > 0 ? Math.max(DUR, L + 0.9) : L + 1.6;   // ringing and the timeline run to here
const OUT = DUR > 0 ? END - 0.3 : END;                     // exit starts here (dur 0 = no exit)
// "calling..." -> base text + three dots that cycle (a line without trailing dots stays static)
const ct = String(V('callingText'));
const dotted = /(\.\.\.|…)\s*$/.test(ct);
CLT.textContent = dotted ? ct.replace(/(\.\.\.|…)\s*$/, '') : ct;
if (!dotted) CDS.forEach(function(d){ d.style.display = 'none'; });
if (!String(V('clock')).trim()) Q('.clk').style.display = 'none';

// initial states (outside the timeline)
gsap.set([LP, RP], { y: 70, opacity: 0 });
gsap.set([LPH, RPH], { transformOrigin: '50% 60%' });
gsap.set([LBY, LBN], { y: 16, opacity: 0, scale: 0.9, transformOrigin: '50% 100%' });
gsap.set(LBF, { scaleX: 0, transformOrigin: '0% 50%' });
gsap.set(NT, { y: -360 });
gsap.set(PG, { opacity: 0 });
gsap.set(SP, { scale: 0, opacity: 0, transformOrigin: '0% 50%' });
gsap.set(TK, { strokeDasharray: 24, strokeDashoffset: 24 });
gsap.set(WK, { opacity: 0 });
gsap.set(RG, { opacity: 0, scale: 1 });
gsap.set(CDS, { opacity: 0 });

// 1. both phones rise in, labels pop on top
tl.fromTo(LP, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out', immediateRender: false }, 0);
tl.fromTo(RP, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out', immediateRender: false }, 0.08);
tl.fromTo(LBY, { y: 16, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.34, ease: 'back.out(2.2)', immediateRender: false }, 0.2);
tl.fromTo(LBN, { y: 16, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.34, ease: 'back.out(2.2)', immediateRender: false }, 0.27);

// 2. the right phone rings from the start to the end: ring pulse, buzz, accept bounce, dots cycling
const R0 = 0.3, PER = 0.62;
let k = 0;
for (let t = R0; t < OUT - 0.05; t += PER, k++) {
  tl.fromTo(RG[k % RG.length], { scale: 1, opacity: 0.9 }, { scale: 2.15, opacity: 0, duration: 1.1, ease: 'power2.out', immediateRender: false }, t);
  tl.to(RPH, { keyframes: [
    { x: -3, rotation: -1, duration: 0.035 }, { x: 3, rotation: 1, duration: 0.035 }, { x: -3, rotation: -1, duration: 0.035 },
    { x: 3, rotation: 1, duration: 0.035 }, { x: -2, rotation: -0.5, duration: 0.035 }, { x: 0, rotation: 0, duration: 0.04 } ], ease: 'none' }, t);
  tl.to(OK, { keyframes: [ { scale: 1.14, duration: 0.12, ease: 'power2.out' }, { scale: 1, duration: 0.28, ease: 'power2.inOut' } ] }, t);
}
for (let t = R0, c = 0; t < END; t += 0.36, c++) { const n = (c % 3) + 1; CDS.forEach(function(d, i){ tl.set(d, { opacity: i < n ? 1 : 0 }, t); }); }

// 3. the left phone: notification drops in under the island, lands with a ping at landAt
tl.fromTo(NT, { y: -360 }, { y: 0, duration: 0.46, ease: 'back.out(1.35)', immediateRender: false }, L - 0.32);
tl.fromTo(PG, { scale: 1, opacity: 0.95 }, { scale: 1.16, opacity: 0, duration: 0.6, ease: 'power2.out', immediateRender: false }, L);
tl.fromTo(WK, { opacity: 0 }, { opacity: 0.14, duration: 0.08, ease: 'power1.out', immediateRender: false }, L - 0.02);
tl.to(WK, { opacity: 0, duration: 0.5, ease: 'power2.out' }, L + 0.06);
tl.to(LPH, { scale: 1.03, duration: 0.09, ease: 'power2.out' }, L);
tl.to(LPH, { scale: 1, duration: 0.34, ease: 'back.out(3)' }, L + 0.09);
tl.fromTo(SP, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: 'back.out(2.6)', immediateRender: false }, L + 0.16);
tl.to(TK, { strokeDashoffset: 0, duration: 0.22, ease: 'power2.out' }, L + 0.26);
// YOU floods cyan: you won the race
tl.fromTo(LBF, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, L + 0.04);
tl.to(LBY, { scale: 1.12, duration: 0.1, ease: 'power2.out' }, L + 0.04);
tl.to(LBY, { scale: 1, duration: 0.32, ease: 'back.out(3)' }, L + 0.14);

// 4. exit
if (DUR > 0) {
  tl.to(LP, { y: -46, opacity: 0, duration: 0.28, ease: 'power2.in' }, OUT);
  tl.to(RP, { y: -46, opacity: 0, duration: 0.28, ease: 'power2.in' }, OUT + 0.04);
}
tl.set({}, {}, END);

window.__timelines["two-phones"] = tl;
</script>
