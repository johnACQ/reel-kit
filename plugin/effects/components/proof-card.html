<!doctype html>
<html data-composition-variables='[{"id": "screenshot", "type": "string", "label": "Real headline screenshot (path)", "default": "compositions/assets/proof_placeholder.svg"}, {"id": "source", "type": "string", "label": "Source chip", "default": "Source: publication, date"}]'>
<head><meta charset="UTF-8" /><!-- reel-kit effect: proof-card. Colours and fonts come from scripts/rebrand.mjs. --></head>
<body>
<template>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&family=Instrument+Serif&display=swap" />
<style>
#root{position:absolute;inset:0;width:100%;height:100%;font-family:Roboto,Arial,sans-serif;color:#0B0F12;}
.card{position:absolute;background:#FFFFFF;border:1px solid rgba(11,15,18,.10);border-radius:18px;box-shadow:0 24px 60px rgba(11,15,18,.28);}
.mono{font-family:'Roboto Mono',monospace;}
.fill{background:#00BEFF;color:#0B0F12;border-radius:10px;padding:0 .18em;}
.card{left:150px;top:280px;width:760px;padding:22px;}
.card img{display:block;width:100%;border-radius:8px;border:1px solid rgba(11,15,18,.10);}
.src{margin-top:16px;display:inline-block;background:#F4F6F8;border-radius:99px;padding:8px 18px;font:500 22px Roboto,sans-serif;color:#5B6670;}
</style>
<div id="root" data-composition-id="proof-card" data-width="1080" data-height="1920">
<div class="card enter"><img data-var-src="screenshot" src="compositions/assets/proof_placeholder.svg" alt="headline screenshot" /><div class="src" data-var-text="source">Source: publication, date</div></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const ent = document.querySelectorAll(".enter");  // runtime scopes queries to this mount; an id-prefixed selector finds nothing once a component is mounted twice
if (ent.length) tl.fromTo(ent, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.04);

window.__timelines["proof-card"] = tl;
</script>
</template>
</body>
</html>
