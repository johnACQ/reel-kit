<!doctype html>
<html data-composition-variables='[{"id": "zoneLabel", "type": "string", "label": "Drop zone label", "default": "Drop raw footage"}, {"id": "fileName", "type": "string", "label": "File name", "default": "SAMPLE_take_04.MP4"}, {"id": "fileMeta", "type": "string", "label": "Size / duration line", "default": "SAMPLE \u00b7 0:57 \u00b7 1080x1920"}, {"id": "count", "type": "number", "label": "File counter ticks up to (0 hides it)", "default": 3, "min": 0, "max": 9, "step": 1}, {"id": "countUnit", "type": "string", "label": "Counter word (plural; 1 drops the trailing s)", "default": "files"}, {"id": "dropAt", "type": "number", "label": "Landing beat (s from clip start)", "default": 0.6, "min": 0.46, "step": 0.05, "unit": "s"}, {"id": "thumb", "type": "string", "label": "Thumbnail image (compositions/assets/...)", "default": "compositions/assets/fx_ui/shot_3.svg"}, {"id": "playBadge", "type": "boolean", "label": "Play badge on the thumbnail (off for a document, e.g. a PDF)", "default": true}]'>
<head><meta charset="UTF-8" /><!-- reel-kit effect: file-drop. Colours and fonts come from scripts/rebrand.mjs. --></head>
<body>
<template>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&family=Instrument+Serif&display=swap" />
<style>
#root{position:absolute;inset:0;width:100%;height:100%;font-family:Roboto,Arial,sans-serif;color:#0B0F12;}
.card{position:absolute;background:#FFFFFF;border:1px solid rgba(11,15,18,.10);border-radius:18px;box-shadow:0 24px 60px rgba(11,15,18,.28);}
.mono{font-family:'Roboto Mono',monospace;}
.fill{background:#00BEFF;color:#0B0F12;border-radius:10px;padding:0 .18em;}
.card{left:96px;top:226px;width:800px;padding:14px;}
.zone{position:relative;height:200px;border-radius:14px;border:3px dashed rgba(11,15,18,.26);background:#F4F6F8;box-shadow:0 0 0 0 rgba(0,190,255,0);}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:18px;}
.ico{width:60px;height:60px;border-radius:99px;background:#FFFFFF;box-shadow:0 4px 14px rgba(11,15,18,.12);display:flex;align-items:center;justify-content:center;}
.zl{font:700 32px Roboto,sans-serif;color:#0B0F12;}
.cnt{position:absolute;top:-17px;right:-17px;height:38px;}
.cv{position:absolute;top:0;right:0;white-space:nowrap;font:500 20px/38px 'Roboto Mono',monospace;letter-spacing:1px;padding:0 14px;border-radius:99px;background:#00BEFF;color:#0B0F12;box-shadow:0 6px 16px rgba(11,15,18,.25);}
.f,.g{position:absolute;left:105px;top:24px;width:552px;height:146px;border-radius:14px;background:#FFFFFF;border:1px solid rgba(11,15,18,.12);}
.g{border-color:rgba(11,15,18,.18);box-shadow:0 8px 20px rgba(11,15,18,.18);}
.f{display:flex;align-items:center;gap:20px;padding:0 20px 0 14px;box-shadow:0 22px 44px rgba(11,15,18,.28),0 2px 6px rgba(11,15,18,.12);}
.th{position:relative;flex:none;width:68px;height:120px;border-radius:9px;overflow:hidden;background:#0B0F12;}
.th img{display:block;width:100%;height:100%;object-fit:cover;}
.pl{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:99px;background:rgba(11,15,18,.62);display:flex;align-items:center;justify-content:center;}
.fi{flex:1;min-width:0;}
.fn{font:500 27px 'Roboto Mono',monospace;color:#0B0F12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fm{margin-top:6px;font:400 19px 'Roboto Mono',monospace;color:#5B6670;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pr{margin-top:14px;height:8px;border-radius:99px;background:#E6EAED;overflow:hidden;}
.pf{width:100%;height:100%;border-radius:99px;background:#00BEFF;}
.ok{flex:none;width:46px;height:46px;border-radius:99px;background:#00BEFF;display:flex;align-items:center;justify-content:center;}
</style>
<div id="root" data-composition-id="file-drop" data-width="1080" data-height="1920">
<div class="card"><div class="zone">
<div class="hint" data-layout-allow-overlap><div class="ico"><svg viewBox="0 0 40 40" width="30" height="30"><path d="M20 7v17M12.5 17.5L20 25l7.5-7.5" fill="none" stroke="#0B0F12" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 27v5h24v-5" fill="none" stroke="#0B0F12" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="zl" data-layout-allow-overlap data-var-text="zoneLabel">Drop raw footage</div></div>
<div class="g g2"></div><div class="g g1"></div>
<div class="f"><div class="th"><img data-var-src="thumb" src="compositions/assets/fx_ui/shot_3.svg" alt="" /><div class="pl"><svg viewBox="0 0 20 20" width="14" height="14"><path d="M6 4l10 6-10 6z" fill="#FFFFFF"/></svg></div></div>
<div class="fi"><div class="fn" data-var-text="fileName">SAMPLE_take_04.MP4</div><div class="fm" data-layout-allow-overlap data-var-text="fileMeta">SAMPLE · 0:57 · 1080x1920</div><div class="pr"><div class="pf"></div></div></div>
<div class="ok"><svg viewBox="0 0 40 40" width="26" height="26"><path d="M10 21l7 7 13-14" fill="none" stroke="#0B0F12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="cnt" data-slot="cnt"></div></div>
</div></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
// fallback to the (mount-scoped) document: when a component is mounted twice the runtime renames the root, so the id selector finds nothing
const R = document.querySelector("[data-composition-id='file-drop']") || document;
const Q = function(s){ return R.querySelector(s); };
const QA = function(s){ return Array.prototype.slice.call(R.querySelectorAll(s)); };
const D = {"zoneLabel": "Drop raw footage", "fileName": "SAMPLE_take_04.MP4", "fileMeta": "SAMPLE \u00b7 0:57 \u00b7 1080x1920", "count": 3, "countUnit": "files", "dropAt": 0.6, "thumb": "compositions/assets/fx_ui/shot_3.svg", "playBadge": true};
const VV = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
const V = function(k){ return (VV[k] === undefined || VV[k] === null || VV[k] === '') ? D[k] : VV[k]; };
const N = function(k){ const x = Number(V(k)); return isFinite(x) ? x : Number(D[k]); };
const card = Q('.card'), zone = Q('.zone'), hint = Q('.hint'), f = Q('.f'), pf = Q('.pf'), ok = Q('.ok');
const g1 = Q('.g1'), g2 = Q('.g2'), cnt = Q('[data-slot="cnt"]');
const L = Math.max(0.46, N('dropAt'));
// play badge: on by default (video files); off for a document card
const PBV = V('playBadge');
if (PBV === false || PBV === 'false' || PBV === 0 || PBV === '0' || PBV === 'off' || PBV === 'no') Q('.pl').style.display = 'none';
const count = Math.max(0, Math.min(9, Math.round(N('count'))));
const unit = String(V('countUnit'));
// Counter: one span per value, swapped with tl.set.
cnt.textContent = '';
const vals = [];
for (let i = 1; i <= count; i++) { const s = document.createElement('div'); s.className = 'cv'; s.textContent = i + ' ' + (i === 1 ? unit.replace(/s$/i, '') : unit); cnt.appendChild(s); vals.push(s); }

// Initial states.
gsap.set(card, { opacity: 0, y: -26, scale: 0.97, transformOrigin: '50% 0%' });
gsap.set(f, { y: -500, rotation: -13, transformOrigin: '50% 100%' });
gsap.set([g1, g2], { opacity: 0, y: 0, scale: 0.9, transformOrigin: '50% 0%' });
gsap.set(pf, { scaleX: 0, transformOrigin: '0% 50%' });
gsap.set(ok, { scale: 0, opacity: 0 });
gsap.set(vals, { display: 'none' });
gsap.set(cnt, { scale: 0.6, opacity: 0, transformOrigin: '100% 0%' });

// Enter.
tl.fromTo(card, { opacity: 0, y: -26, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: 'power3.out', immediateRender: false }, 0);
// Zone wakes as the file approaches.
tl.to(zone, { borderColor: 'rgba(0,190,255,.85)', backgroundColor: '#EAF8FF', duration: 0.2, ease: 'power1.out' }, L - 0.24);
// Fall with gravity, slight tilt.
tl.fromTo(f, { y: -500, rotation: -13 }, { y: 0, rotation: 2.5, duration: 0.46, ease: 'power2.in', immediateRender: false }, L - 0.46);
tl.to(hint, { opacity: 0, scale: 0.94, duration: 0.14, ease: 'power1.in' }, L - 0.1);
// Land: small bounce and settle.
tl.to(f, { y: -18, rotation: -1.2, duration: 0.13, ease: 'power2.out' }, L);
tl.to(f, { y: 0, rotation: 0, duration: 0.17, ease: 'power2.in' }, L + 0.13);
tl.to(f, { y: -4, duration: 0.07, ease: 'power1.out' }, L + 0.3);
tl.to(f, { y: 0, duration: 0.08, ease: 'power1.in' }, L + 0.37);
// Cyan flash on landing, then settles to an accepted state.
tl.fromTo(zone, { boxShadow: '0 0 0 0px rgba(0,190,255,.55)' }, { boxShadow: '0 0 0 18px rgba(0,190,255,0)', duration: 0.5, ease: 'power2.out', immediateRender: false }, L);
tl.to(zone, { borderColor: '#00BEFF', backgroundColor: '#CCF2FF', duration: 0.06, ease: 'none' }, L);
tl.to(zone, { borderColor: 'rgba(0,190,255,.7)', backgroundColor: '#F4F6F8', duration: 0.45, ease: 'power2.out' }, L + 0.08);
// Upload bar fills, check pops.
tl.to(pf, { scaleX: 1, duration: 0.42, ease: 'power1.inOut' }, L + 0.12);
tl.to(ok, { scale: 1, opacity: 1, duration: 0.24, ease: 'back.out(2.6)' }, L + 0.5);
// Counter ticks 1 -> count; ghost cards stack behind as it climbs.
if (vals.length) {
  tl.to(cnt, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(2.4)' }, L + 0.1);
  const step = Math.min(0.2, 0.55 / Math.max(1, vals.length - 1));
  vals.forEach(function(s, i){
    const at = L + 0.1 + i * step;
    tl.set(s, { display: 'block' }, at);
    if (i + 1 < vals.length) tl.set(s, { display: 'none' }, L + 0.1 + (i + 1) * step);
    if (i > 0) tl.fromTo(cnt, { scale: 1.16 }, { scale: 1, duration: 0.16, ease: 'power2.out', immediateRender: false }, at);
  });
  if (vals.length >= 2) tl.fromTo(g1, { opacity: 0, y: 0, scale: 0.95 }, { opacity: 1, y: -12, scale: 0.95, duration: 0.2, ease: 'back.out(2)', immediateRender: false }, L + 0.1 + step);
  if (vals.length >= 3) tl.fromTo(g2, { opacity: 0, y: 0, scale: 0.9 }, { opacity: 1, y: -23, scale: 0.9, duration: 0.2, ease: 'back.out(2)', immediateRender: false }, L + 0.1 + 2 * step);
}
// Exit.
tl.to(card, { opacity: 0, y: -34, scale: 0.97, duration: 0.28, ease: 'power2.in' }, L + 1.1);
tl.set({}, {}, L + 1.4);
window.__timelines["file-drop"] = tl;
</script>
</template>
</body>
</html>
