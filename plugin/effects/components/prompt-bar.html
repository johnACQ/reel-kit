<!doctype html>
<html data-composition-variables='[{"id": "label", "type": "string", "label": "Kicker", "default": "PROMPT"}, {"id": "text", "type": "string", "label": "Typed line", "default": "SAMPLE: edit my raw take into a reel"}, {"id": "typeStart", "type": "number", "label": "Typing starts (s from clip start)", "default": 0.3, "min": 0, "step": 0.05, "unit": "s"}, {"id": "sendAt", "type": "number", "label": "Send beat (s from clip start, lock to the spoken word)", "default": 1.35, "min": 0.4, "step": 0.05, "unit": "s"}]'>
<head><meta charset="UTF-8" /><!-- reel-kit effect: prompt-bar. Colours and fonts come from scripts/rebrand.mjs. --></head>
<body>
<template>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&family=Instrument+Serif&display=swap" />
<style>
#root{position:absolute;inset:0;width:100%;height:100%;font-family:Roboto,Arial,sans-serif;color:#0B0F12;}
.card{position:absolute;background:#FFFFFF;border:1px solid rgba(11,15,18,.10);border-radius:18px;box-shadow:0 24px 60px rgba(11,15,18,.28);}
.mono{font-family:'Roboto Mono',monospace;}
.fill{background:#00BEFF;color:#0B0F12;border-radius:10px;padding:0 .18em;}
.bar{position:absolute;left:96px;top:252px;width:800px;}
.bg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 22px 26px rgba(11,15,18,.30)) drop-shadow(0 2px 4px rgba(11,15,18,.12));}
.in{position:relative;display:flex;align-items:center;gap:22px;min-height:112px;padding:16px 18px 16px 40px;}
.tx{flex:1;min-width:0;}
.kick{display:flex;align-items:center;gap:10px;font:500 18px 'Roboto Mono',monospace;letter-spacing:3px;color:#5B6670;margin-bottom:4px;}
.dot{width:10px;height:10px;border-radius:99px;background:#00BEFF;}
.line{font:500 34px/1.3 Roboto,sans-serif;color:#0B0F12;min-height:44px;}
.w{display:inline-block;white-space:nowrap;}
.c{display:inline-block;white-space:pre;}
.caret{display:inline-block;width:3px;height:38px;margin-left:2px;vertical-align:-7px;background:#0B0F12;border-radius:2px;}
.send{position:relative;flex:none;width:76px;height:76px;}
.ring{position:absolute;inset:0;border-radius:99px;border:4px solid #00BEFF;opacity:0;}
.btn{position:absolute;inset:0;border-radius:99px;background:#E6EAED;color:#5B6670;display:flex;align-items:center;justify-content:center;}
.btn svg{display:block;}
</style>
<div id="root" data-composition-id="prompt-bar" data-width="1080" data-height="1920">
<div class="bar"><svg class="bg"><rect class="bgr" x="0" y="0" width="800" height="100%" rx="56" ry="56" fill="#FFFFFF" stroke="rgba(11,15,18,.10)" stroke-width="1"/></svg><div class="in">
<div class="tx"><div class="kick"><span class="dot"></span><span data-var-text="label">PROMPT</span></div><div class="line" data-slot="line"></div></div>
<div class="send"><div class="ring"></div><div class="btn"><svg viewBox="0 0 40 40" width="34" height="34"><path d="M20 31V10M10.5 19.5L20 10l9.5 9.5" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
</div></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
// fallback to the (mount-scoped) document: when a component is mounted twice the runtime renames the root, so the id selector finds nothing
const R = document.querySelector("[data-composition-id='prompt-bar']") || document;
const Q = function(s){ return R.querySelector(s); };
const QA = function(s){ return Array.prototype.slice.call(R.querySelectorAll(s)); };
const D = {"label": "PROMPT", "text": "SAMPLE: edit my raw take into a reel", "typeStart": 0.3, "sendAt": 1.35};
const VV = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
const V = function(k){ return (VV[k] === undefined || VV[k] === null || VV[k] === '') ? D[k] : VV[k]; };
const N = function(k){ const x = Number(V(k)); return isFinite(x) ? x : Number(D[k]); };
const bar = Q('.bar'), bg = Q('.bgr'), line = Q('[data-slot="line"]'), kick = Q('.kick'), btn = Q('.btn'), ring = Q('.ring');
const text = String(V('text'));
const t0 = Math.max(0, N('typeStart'));
const S = Math.max(t0 + 0.4, N('sendAt'));
// Build one span per character, grouped by word so the line only wraps between words.
line.textContent = '';
const chars = [];
text.split(/(\s+)/).forEach(function(tok){
  if (!tok) return;
  if (/^\s+$/.test(tok)) { const sp = document.createElement('span'); sp.textContent = ' '; line.appendChild(sp); chars.push({ el: sp, space: true }); return; }
  const w = document.createElement('span'); w.className = 'w';
  for (const ch of tok) { const c = document.createElement('span'); c.className = 'c'; c.textContent = ch; w.appendChild(c); chars.push({ el: c, space: false }); }
  line.appendChild(w);
});
const caret = document.createElement('span'); caret.className = 'caret'; line.appendChild(caret);
const glyphs = chars.filter(function(c){ return !c.space; }).map(function(c){ return c.el; });

// Initial states (outside the timeline).
gsap.set(chars.map(function(c){ return c.el; }), { display: 'none' });
gsap.set(bar, { opacity: 0, y: -46, scale: 0.96, transformOrigin: '50% 50%' });
gsap.set(caret, { opacity: 1 });

// Enter: slides down into the top third.
tl.fromTo(bar, { opacity: 0, y: -46, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: 'power3.out', immediateRender: false }, 0);

// Typing: human jitter, deterministic. Window ends 0.35 s before the send beat.
const tEnd = Math.max(t0 + 0.2, S - 0.35);
const n = chars.length || 1;
const jit = chars.map(function(_, i){ const x = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return 0.55 + 0.9 * (x - Math.floor(x)); });
const jsum = jit.reduce(function(a, b){ return a + b; }, 0) || 1;
let base = (tEnd - t0) / jsum;
base = Math.min(base, 0.075 / 1.0);
let t = t0;
chars.forEach(function(c, i){ tl.set(c.el, { display: c.space ? 'inline' : 'inline-block' }, t); t += base * jit[i]; });
const typedAt = t;
// Send button wakes up on the first character.
tl.to(btn, { backgroundColor: '#00BEFF', color: '#0B0F12', duration: 0.18, ease: 'power1.out' }, t0);
// Caret blinks while waiting for the send beat.
for (let b = typedAt + 0.28; b < S - 0.05; b += 0.5) { tl.set(caret, { opacity: 0 }, b); if (b + 0.25 < S - 0.05) tl.set(caret, { opacity: 1 }, b + 0.25); }
tl.set(caret, { opacity: 0 }, S - 0.04);

// Send: press, pulse ring, text lifts away, pill collapses into the button, button flies off.
tl.to(btn, { scale: 0.84, duration: 0.08, ease: 'power2.out' }, S);
tl.to(btn, { scale: 1.12, duration: 0.16, ease: 'back.out(3)' }, S + 0.08);
tl.to(btn, { scale: 1, duration: 0.12, ease: 'power2.out' }, S + 0.24);
tl.fromTo(ring, { scale: 1, opacity: 0.85 }, { scale: 2.1, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false }, S + 0.04);
if (glyphs.length) tl.to(glyphs, { y: -34, opacity: 0, duration: 0.2, ease: 'power2.in', stagger: { amount: Math.min(0.13, glyphs.length * 0.005) } }, S + 0.07);
tl.to(kick, { y: -20, opacity: 0, duration: 0.22, ease: 'power2.in' }, S + 0.08);
tl.to(bg, { attr: { x: 688, width: 112 }, duration: 0.3, ease: 'power3.inOut' }, S + 0.36);
tl.to(bar, { y: -70, scale: 0.55, opacity: 0, transformOrigin: '742px 56px', duration: 0.24, ease: 'power2.in' }, S + 0.6);
tl.set({}, {}, S + 0.86);
window.__timelines["prompt-bar"] = tl;
</script>
</template>
</body>
</html>
