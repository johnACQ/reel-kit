<script>
const tl = gsap.timeline({ paused: true });
// Plain class, never [data-composition-id=...]: a second mount of a component gets a renamed root, and the
// runtime scopes document queries to each mount (round-one lesson 1).
const R = document.querySelector(".shc");
const Q = function(s){ return R.querySelector(s); };
const QA = function(s){ return Array.prototype.slice.call(R.querySelectorAll(s)); };
const D = {"chipLabel": "SAMPLE contact", "sendText": "Send", "sentText": "Sent", "searchText": "Search", "flyAt": 0.45, "dur": 1.9, "top": 300, "centerX": 496, "scale": 1};
const VV = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
const V = function(k){ const x = VV[k]; return (x === undefined || x === null || x === '') ? D[k] : x; };
const N = function(k){ const x = Number(V(k)); return isFinite(x) ? x : Number(D[k]); };

const CARD = Q('.sc'), CHS = QA('.ch'), TGT = Q('.ch.t'), AV = Q('.ch.t .ca'), SEND = Q('.send'), SENT = Q('.sent');
const TK = Q('.sent path'), PL = Q('.pl'), PR = Q('.pr'), TDS = QA('.td');
const KF = [{"x":-44.0,"y":447.0,"r":-83.2,"d":0.0},{"x":-40.4,"y":419.2,"r":-82.1,"d":0.0181},{"x":-36.3,"y":391.5,"r":-80.8,"d":0.0182},{"x":-31.5,"y":363.9,"r":-79.5,"d":0.0183},{"x":-26.0,"y":336.4,"r":-78.0,"d":0.0185},{"x":-19.8,"y":309.1,"r":-76.5,"d":0.0188},{"x":-12.9,"y":281.9,"r":-74.8,"d":0.0192},{"x":-5.1,"y":255.0,"r":-73.1,"d":0.0196},{"x":3.4,"y":228.3,"r":-71.2,"d":0.0202},{"x":12.9,"y":202.0,"r":-69.1,"d":0.0208},{"x":23.4,"y":176.0,"r":-66.9,"d":0.0216},{"x":34.9,"y":150.4,"r":-64.5,"d":0.0226},{"x":47.6,"y":125.4,"r":-61.8,"d":0.0237},{"x":61.5,"y":101.1,"r":-58.9,"d":0.0251},{"x":76.6,"y":77.5,"r":-55.6,"d":0.0268},{"x":93.2,"y":54.9,"r":-51.9,"d":0.0288},{"x":111.2,"y":33.5,"r":-47.9,"d":0.0311},{"x":130.8,"y":13.4,"r":-43.3,"d":0.0336},{"x":152.0,"y":-4.8,"r":-38.1,"d":0.0363},{"x":174.9,"y":-21.0,"r":-32.3,"d":0.0386},{"x":199.4,"y":-34.6,"r":-25.7,"d":0.0401},{"x":225.3,"y":-45.2,"r":-18.5,"d":0.0401},{"x":252.4,"y":-52.3,"r":-10.7,"d":0.0386},{"x":280.2,"y":-55.5,"r":-2.5,"d":0.0363},{"x":308.2,"y":-54.7,"r":5.9,"d":0.0336},{"x":335.8,"y":-49.9,"r":14.1,"d":0.0311},{"x":362.4,"y":-41.2,"r":21.9,"d":0.0288},{"x":387.7,"y":-29.1,"r":29.1,"d":0.0268},{"x":411.3,"y":-14.1,"r":35.6,"d":0.0251},{"x":433.2,"y":3.3,"r":41.4,"d":0.0237},{"x":453.3,"y":22.8,"r":46.7,"d":0.0226},{"x":471.7,"y":44.0,"r":51.3,"d":0.0216},{"x":488.4,"y":66.5,"r":55.5,"d":0.0208},{"x":503.5,"y":90.1,"r":59.3,"d":0.0202},{"x":517.1,"y":114.6,"r":62.7,"d":0.0196},{"x":529.2,"y":139.8,"r":65.8,"d":0.0192},{"x":540.1,"y":165.7,"r":68.6,"d":0.0188},{"x":549.7,"y":192.0,"r":71.2,"d":0.0185},{"x":558.2,"y":218.7,"r":73.6,"d":0.0183},{"x":565.6,"y":245.7,"r":75.8,"d":0.0182},{"x":572.0,"y":273.0,"r":77.7,"d":0.0181}];       // the route, resampled by arc length: x, y, heading, time share
const TR = [0.0363, 0.085, 0.136, 0.1911, 0.2529, 0.3253, 0.4138, 0.5175, 0.6173, 0.7, 0.7684, 0.8276, 0.8811];       // trail dots: time share at which the plane passes each
const F = Math.max(0.3, N('flyAt'));
const FD = 0.62, T0 = F + 0.1, LAND = T0 + FD;
const DUR = N('dur');
const END = DUR > 0 ? Math.max(DUR, LAND + 0.5) : LAND + 0.9;
const OUT = END - 0.28;

// initial states (outside the timeline)
gsap.set(CARD, { y: 46, opacity: 0, scale: 0.96, transformOrigin: '50% 0%' });
gsap.set(CHS, { y: 14, opacity: 0 });
gsap.set(TGT, { transformOrigin: '50% 50%' });
gsap.set(PL, { x: KF[0].x, y: KF[0].y, rotation: KF[0].r, scale: 0, opacity: 0, transformOrigin: '50% 50%' });
gsap.set(SENT, { scale: 0.5, opacity: 0 });
gsap.set(TK, { strokeDasharray: 24, strokeDashoffset: 24 });
gsap.set(PR, { opacity: 0, transformOrigin: '50% 50%' });
gsap.set(AV, { boxShadow: '0 0 0 0px rgba(0,190,255,0)' });
gsap.set(TDS, { opacity: 0, scale: 0.3 });

// 1. the sheet rises in, chips settle one by one
tl.fromTo(CARD, { y: 46, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.42, ease: 'power3.out', immediateRender: false }, 0);
CHS.forEach(function(c, i){ tl.fromTo(c, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, 0.12 + i * 0.06); });

TDS.forEach(function(d, i){
  const t = T0 + TR[i] * FD;
  tl.fromTo(d, { opacity: 0, scale: 0.3 }, { opacity: 0.95, scale: 1, duration: 0.08, ease: 'power1.out', immediateRender: false }, t);
  tl.to(d, { opacity: 0, scale: 0.5, duration: 0.3, ease: 'power1.in' }, t + 0.16);
});

// 3. lands: the plane is absorbed into Send, the chip pulses, the button flips to a cyan Sent tick
tl.to(PL, { scale: 0.35, opacity: 0, duration: 0.12, ease: 'power2.in' }, LAND - 0.05);

tl.to(TGT, { backgroundColor: '#E2F6FF', duration: 0.18, ease: 'power1.out' }, LAND);

// 4. exit (dur 0 = none)
if (DUR > 0) tl.to(CARD, { y: -36, opacity: 0, duration: 0.26, ease: 'power2.in' }, OUT);
tl.set({}, {}, END);

window.__timelines["share-card"] = tl;
</script>
