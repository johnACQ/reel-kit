<!doctype html>
<html data-composition-variables='[{"id": "kicker", "type": "string", "label": "Small serif line above the word", "default": "SAMPLE kicker line"}, {"id": "word", "type": "string", "label": "The huge word (one word, Bebas caps)", "default": "HOOK"}, {"id": "wordSize", "type": "number", "label": "Word size (px)", "default": 330}, {"id": "wordY", "type": "number", "label": "Top of the word box (px). Check the head with snapshots: 70% of every letter must show", "default": 300}, {"id": "kickerY", "type": "number", "label": "Top of the kicker (px)", "default": 232}, {"id": "color", "type": "string", "label": "Word + kicker colour (ink on a light wall, white on a dark one)", "default": "#0B0F12"}, {"id": "kickerAt", "type": "number", "label": "Kicker in (s from clip start)", "default": 0.05}, {"id": "wordAt", "type": "number", "label": "Word lands, on the spoken word (s)", "default": 0.42}, {"id": "outAt", "type": "number", "label": "Word + kicker leave, done 0.33 s later (s)", "default": 1.38}, {"id": "style", "type": "string", "label": "Entrance: rise (letters rise from behind the head) or pop (blur-pop)", "default": "rise"}]'>
<head><meta charset="UTF-8" /><!-- reel-kit effect: kinetic-hook-behind. Colours and fonts come from scripts/rebrand.mjs. --></head>
<body>
<template>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&family=Instrument+Serif&display=swap" />
<style>
@font-face{font-family:'Bebas Neue';font-style:normal;font-weight:400;font-display:block;src:url('compositions/assets/fx_footage/fonts/BebasNeue-400.woff2') format('woff2');}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:block;src:url('compositions/assets/fx_footage/fonts/InstrumentSerif-400.woff2') format('woff2');}
#root{position:absolute;inset:0;width:100%;height:100%;font-family:Roboto,Arial,sans-serif;color:#0B0F12;}
.card{position:absolute;background:#FFFFFF;border:1px solid rgba(11,15,18,.10);border-radius:18px;box-shadow:0 24px 60px rgba(11,15,18,.28);}
.mono{font-family:'Roboto Mono',monospace;}
.fill{background:#00BEFF;color:#0B0F12;border-radius:10px;padding:0 .18em;}
.kh{position:absolute;inset:0;}
.kh-kick{position:absolute;left:72px;right:72px;top:232px;text-align:center;font:400 58px/1.1 'Instrument Serif',serif;white-space:nowrap;}
.kh-word{position:absolute;left:40px;right:40px;top:300px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:330px;line-height:.86;
  letter-spacing:4px;text-transform:uppercase;white-space:nowrap;}
.kh-word span{display:inline-block;}
</style>
<div id="root" data-composition-id="kinetic-hook-behind" data-width="1080" data-height="1920">
<div class="kh" data-fx="kinetic-hook-behind"><div class="kh-kick" data-var-text="kicker">SAMPLE kicker line</div>
<div class="kh-word" data-slot="word" data-layout-allow-occlusion></div></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const ent = document.querySelectorAll("[data-composition-id='kinetic-hook-behind'] .enter");
if (ent.length) tl.fromTo(ent, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.04);
const v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
const num = function(k, d){ const x = Number(v[k]); return (v[k] === undefined || v[k] === '' || !isFinite(x)) ? d : x; };
const str = function(k, d){ return (v[k] === undefined || v[k] === null || String(v[k]) === '') ? d : String(v[k]); };

const W = document.querySelector('[data-fx="kinetic-hook-behind"]');
const q = function(s){ return W.querySelector(s); };
const kick = q('.kh-kick'), word = q("[data-slot='word']");
const col = str('color', '#0B0F12'); kick.style.color = col; word.style.color = col;
kick.style.top = num('kickerY', 232) + 'px'; word.style.top = num('wordY', 300) + 'px'; word.style.fontSize = num('wordSize', 330) + 'px';
const letters = [];
if (word && !word.dataset.done) { word.dataset.done = '1';
  str('word', 'HOOK').toUpperCase().split('').forEach(function(ch){ const s = document.createElement('span'); s.textContent = ch === ' ' ? '\u00a0' : ch; word.appendChild(s); letters.push(s); });
}
const kAt = num('kickerAt', .05), wAt = num('wordAt', .42), oAt = num('outAt', 1.38), pop = str('style', 'rise') === 'pop';
gsap.set(kick, { opacity: 0, y: 18 }); gsap.set(letters, { opacity: 0 });
tl.fromTo(kick, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .32, ease: 'power3.out', immediateRender: false }, kAt);
if (pop) {
  tl.fromTo(letters, { opacity: 0, scale: 1.3, filter: 'blur(24px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: .26, ease: 'power3.out', stagger: .03, immediateRender: false }, wAt - .05);
} else {
  tl.fromTo(letters, { opacity: 0, yPercent: 62, filter: 'blur(10px)' }, { opacity: 1, yPercent: 0, filter: 'blur(0px)', duration: .46, ease: 'power4.out', stagger: .05, immediateRender: false }, wAt - .05);
}
tl.fromTo(letters, { opacity: 1, yPercent: 0 }, { opacity: 0, yPercent: 55, duration: .24, ease: 'power3.in', stagger: .03, immediateRender: false }, oAt);
tl.fromTo(kick, { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: .22, ease: 'power2.in', immediateRender: false }, oAt + .04);
window.__timelines["kinetic-hook-behind"] = tl;
</script>
</template>
</body>
</html>
