const TM = QA('.tm'), TJ = QA('.tj'), TB = QA('.tb'), NF = QA('.nf');
const C = Math.round(Math.min(5, Math.max(3, N('count'))));
const J = Math.max(0.7, N('jamAt'));
const DUR = N('dur');
const END = DUR > 0 ? Math.max(DUR, J + 1.0) : J + 1.6;   // the shoving runs to here
const OUT = DUR > 0 ? END - 0.28 : END;                    // exit starts here (dur 0 = no exit)
const SC = Math.max(0.2, N('scale')), CX = N('centerX');
if (!String(V('clock')).trim()) Q('.clk').style.display = 'none';

// slots: count 3 = L1, R1 (centred), L2;  4 = + R2;  5 = + L3 (a second row that shoves into the left pair)
const S = SL.map(function(s){ return Object.assign({}, s); });
if (C === 3) { S[1].cy = LBH + 228; S[1].off = 0.03; }
TM.forEach(function(m, i){
  if (i >= C) { m.style.display = 'none'; return; }
  m.style.left = S[i].x + 'px'; m.style.top = (S[i].cy - TS / 2) + 'px'; m.style.zIndex = S[i].z;
});
NF.forEach(function(n, k){ if (k >= C) n.style.display = 'none'; });

// each tile starts fully off its frame edge whatever centerX / scale say (box px = screen px / scale)
const startDX = function(s){
  const left = CX + (s.x - BW / 2) * SC;                      // final screen x of the tile's left edge
  const need = s.side < 0 ? (left + TS * SC) / SC + 40 : (1080 - left) / SC + 40;
  return s.side * Math.max(need, 560);
};

// initial states (outside the timeline)
gsap.set(PWR, { y: 60, opacity: 0 });
gsap.set(LB, { y: 14, scale: 0.9, opacity: 0, transformOrigin: '50% 100%' });
gsap.set(PHN, { transformOrigin: '50% 55%' });
gsap.set(WK, { opacity: 0 });
gsap.set(NF, { y: -26, opacity: 0, scale: 0.92, transformOrigin: '50% 0%' });
const ARR = [];
for (let i = 0; i < C; i++) {
  const s = S[i], dx = startDX(s);
  s.dx = dx; s.ta = J + s.off; s.trav = Math.min(0.62, Math.max(0.42, Math.abs(dx) / 1300));
  gsap.set(TM[i], { x: dx, y: s.dy0, rotation: s.r0 });
  gsap.set(TJ[i], { x: 0, rotation: 0 });
  gsap.set(TB[i], { scaleX: 1, scaleY: 1, transformOrigin: (s.side < 0 ? '100%' : '0%') + ' 50%' });
  gsap.set(TM[i].querySelectorAll('.sl'), { scaleX: 0, opacity: 0, transformOrigin: (s.side < 0 ? '100%' : '0%') + ' 50%' });
  gsap.set(TM[i].querySelectorAll('.iki'), { x: 6, scaleX: 0.2, opacity: 0 });
  ARR.push(i);
}
ARR.sort(function(a, b){ return S[a].ta - S[b].ta; });

// 1. the phone rises in, CUSTOMER pops on top
tl.fromTo(PWR, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.46, ease: 'power3.out', immediateRender: false }, 0);
tl.fromTo(LB, { y: 14, scale: 0.9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.34, ease: 'back.out(2.2)', immediateRender: false }, 0.14);

// 2. the race: every tile flies in flat out from its edge, stretched, speed lines trailing, and slams in at jamAt
for (let i = 0; i < C; i++) {
  const s = S[i], t0 = s.ta - s.trav, inward = -s.side, lines = TM[i].querySelectorAll('.sl'), ticks = TM[i].querySelectorAll('.iki');
  tl.fromTo(TM[i], { x: s.dx }, { x: inward * 12, duration: s.trav, ease: 'none', immediateRender: false }, t0);
  tl.fromTo(TM[i], { y: s.dy0 }, { y: 0, duration: s.trav, ease: 'power1.out', immediateRender: false }, t0);
  tl.fromTo(TM[i], { rotation: s.r0 }, { rotation: s.r, duration: s.trav + 0.18, ease: 'power2.out', immediateRender: false }, t0);
  tl.fromTo(TB[i], { scaleX: 1, scaleY: 1 }, { scaleX: 1.1, scaleY: 0.93, duration: 0.16, ease: 'power2.out', immediateRender: false }, t0);
  tl.fromTo(lines, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.16, ease: 'power2.out', stagger: 0.03, immediateRender: false }, t0 + 0.02);
  tl.to(lines, { scaleX: 0, opacity: 0, duration: 0.08, ease: 'power2.in' }, s.ta - 0.06);
  // impact: squash against the phone, rebound, settle pressed onto its edge
  tl.to(TB[i], { scaleX: 0.84, scaleY: 1.1, duration: 0.05, ease: 'power2.out' }, s.ta);
  tl.to(TB[i], { scaleX: 1, scaleY: 1, duration: 0.42, ease: 'elastic.out(1, 0.45)' }, s.ta + 0.05);
  tl.to(TM[i], { keyframes: [ { x: s.side * 10, duration: 0.13, ease: 'power2.out' }, { x: 0, duration: 0.2, ease: 'power2.inOut' } ] }, s.ta);
  tl.fromTo(ticks, { x: 6, scaleX: 0.2, opacity: 1 }, { x: 24, scaleX: 1, opacity: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, s.ta);
}
// the second row (count 5) hits the jam late and shoves the left pair harder onto the phone
if (C === 5) {
  const t5 = S[4].ta;
  [0, 2].forEach(function(i){ tl.to(TJ[i], { keyframes: [ { x: 11, duration: 0.07, ease: 'power2.out' }, { x: 5, duration: 0.22, ease: 'power2.inOut' } ] }, t5 + 0.01); });
}

// 3. the phone takes the hit: squeeze, shake, screen wakes, one identical notification per tile in arrival order
const T1 = S[ARR[0]].ta;
tl.to(PHN, { keyframes: [ { scaleX: 0.95, scaleY: 1.02, duration: 0.06, ease: 'power2.out' }, { scaleX: 1, scaleY: 1, duration: 0.4, ease: 'elastic.out(1, 0.5)' } ] }, T1 + 0.01);
tl.to(PHN, { keyframes: [ { x: -5, rotation: -1.2, duration: 0.04 }, { x: 5, rotation: 1.2, duration: 0.04 }, { x: -4, rotation: -0.8, duration: 0.04 },
  { x: 3, rotation: 0.6, duration: 0.04 }, { x: 0, rotation: 0, duration: 0.05 } ], ease: 'none' }, T1 + 0.02);
tl.to(LB, { keyframes: [ { y: -8, duration: 0.08, ease: 'power2.out' }, { y: 0, duration: 0.3, ease: 'back.out(3)' } ] }, T1 + 0.02);
tl.fromTo(WK, { opacity: 0 }, { opacity: 0.16, duration: 0.06, ease: 'power1.out', immediateRender: false }, T1);
tl.to(WK, { opacity: 0, duration: 0.45, ease: 'power2.out' }, T1 + 0.06);
ARR.forEach(function(i, k){
  tl.fromTo(NF[k], { y: -26, opacity: 0, scale: 0.92 }, { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)', immediateRender: false }, S[i].ta + 0.03 + k * 0.035);
});

// 4. nobody gets in: they keep shoving (finite yoyo wiggles, own period each), the phone keeps buzzing
const J0 = Math.max.apply(null, ARR.map(function(i){ return S[i].ta; })) + 0.4;
const PER = [0.21, 0.25, 0.23, 0.27, 0.19];
for (let i = 0; i < C; i++) {
  const s = S[i], inward = -s.side, base = (C === 5 && (i === 0 || i === 2)) ? 5 : 0, p = PER[i], t = J0 + i * 0.03;
  const n = Math.floor((OUT - t) / p);
  if (n >= 1) {
    tl.fromTo(TJ[i], { x: base }, { x: base + inward * 7, duration: p, ease: 'sine.inOut', repeat: n - 1, yoyo: true, immediateRender: false }, t);
    tl.fromTo(TJ[i], { rotation: 0 }, { rotation: (i % 2 ? -1 : 1) * 2.2, duration: p * 1.3, ease: 'sine.inOut', repeat: Math.max(0, Math.floor((OUT - t) / (p * 1.3)) - 1), yoyo: true, immediateRender: false }, t);
  }
}
for (let t = J0 + 0.08; t < OUT - 0.2; t += 0.5) {
  tl.to(PHN, { keyframes: [ { x: -3, rotation: -0.6, duration: 0.035 }, { x: 3, rotation: 0.6, duration: 0.035 }, { x: -2, rotation: -0.4, duration: 0.035 },
    { x: 0, rotation: 0, duration: 0.04 } ], ease: 'none' }, t);
}

// 5. exit (goes up, never down over the face)
if (DUR > 0) tl.to(R, { y: -46, opacity: 0, duration: 0.28, ease: 'power2.in' }, OUT);
tl.set({}, {}, END);

window.__timelines["phone-race"] = tl;
</script>
</template>
