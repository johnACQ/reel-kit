  tl.fromTo(j, { y: -1.3 * dir }, { y: 1.3 * dir, duration: bp, ease: "sine.inOut", yoyo: true, repeat: breps, immediateRender: false }, start);
});
// 3. delete one by one: badge press, tile shrinks out, the rest reflow left, counter ticks down
slots.forEach(function (s, i) {
  const d = DEL[i];
  tl.fromTo(badges[i], { scale: 1 }, { scale: 0.72, duration: 0.08, ease: "power2.out", immediateRender: false }, d);
  tl.fromTo(pops[i], { scale: 1, opacity: 1 }, { scale: 0.12, opacity: 0, duration: 0.24, ease: "power2.in", immediateRender: false }, d + 0.06);
  tl.fromTo(s, { width: SLOT }, { width: 0, duration: 0.32, ease: "power3.inOut", immediateRender: false }, d + 0.18);
  tl.fromTo(roll, { y: -i * RH }, { y: -(i + 1) * RH, duration: 0.28, ease: "power3.out", immediateRender: false }, d + 0.14);
});
// 4. empty tray holds, then slides away
const out = DEL[DEL.length - 1] + 0.5 + hold;
tl.fromTo(tray, { x: 0 }, { x: -420, duration: 0.4, ease: "power3.in", immediateRender: false }, out);
tl.fromTo(tray, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, out + 0.2);

window.__timelines["jiggle-delete"] = tl;
</script>
