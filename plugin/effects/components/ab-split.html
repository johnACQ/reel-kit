<style>

<div id="root" data-composition-id="ab-split" data-width="1080" data-height="1920">
<div class="ab-wrap"><div class="ab-row"><div class="ab-slot ab-r" data-layout-allow-overlap><div class="ab-card"><div class="ab-head"><span class="ab-pill" data-var-text="beforeLabel">BEFORE</span><span class="ab-badge"><svg viewBox="0 0 40 40"><path d="M12 12l16 16M28 12L12 28" fill="none" stroke="#0B0F12" stroke-width="5.5" stroke-linecap="round"/></svg></span></div><div class="ab-media"><img data-var-src="beforeImg" src="compositions/assets/fx_proof/sample_before.svg" alt="" /></div><div class="ab-big"><span class="ab-bigc"><svg viewBox="0 0 40 40"><path d="M12 12l16 16M28 12L12 28" fill="none" stroke="#0B0F12" stroke-width="5.5" stroke-linecap="round"/></svg></span></div><div class="ab-line" data-var-text="beforeLine">SAMPLE · the old way</div></div><svg class="ab-crack" viewBox="0 0 100 100" preserveAspectRatio="none" data-layout-allow-overlap><path class="ab-cm" pathLength="1" d="M-1,41 4,43.5 8,42 12,47 16,44 19.5,38 23,39.5 27,46 31,47.5 34,53 38,50 42,45.5 46,43 49.5,48 53,51 57,58 61,55 65,50.5 70,47 74,52 78,56.5 83,60 87,56 92,54.5 96,51 101,52" /><path class="ab-cb" pathLength="1" d="M34,53 32.5,58 30,62 31.5,67 29,73" /><path class="ab-cb" pathLength="1" d="M70,47 72,42 75.5,38 74,33 76,27" /><path class="ab-cb" pathLength="1" d="M16,44 13,38 14,33" /><path class="ab-hl ab-cm" pathLength="1" d="M-1,42.5 4,45.0 8,43.5 12,48.5 16,45.5 19.5,39.5 23,41.0 27,47.5 31,49.0 34,54.5 38,51.5 42,47.0 46,44.5 49.5,49.5 53,52.5 57,59.5 61,56.5 65,52.0 70,48.5 74,53.5 78,58.0 83,61.5 87,57.5 92,56.0 96,52.5 101,53.5" /></svg></div><div class="ab-slot ab-g"><div class="ab-card"><div class="ab-head"><span class="ab-pill" data-var-text="afterLabel">AFTER</span><span class="ab-badge"><svg viewBox="0 0 40 40"><path d="M9 21l7.5 7.5L31 13" fill="none" stroke="#0B0F12" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="ab-media"><img data-var-src="afterImg" src="compositions/assets/fx_proof/sample_after.svg" alt="" /></div><div class="ab-big"><span class="ab-bigc"><svg viewBox="0 0 40 40"><path d="M9 21l7.5 7.5L31 13" fill="none" stroke="#0B0F12" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="ab-line" data-var-text="afterLine">SAMPLE · the new way</div></div><div class="ab-glow"></div></div></div></div>

<script>
const tl = gsap.timeline({ paused: true });
const D = {"beforeLabel": "BEFORE", "beforeLine": "SAMPLE \u00b7 the old way", "afterLabel": "AFTER", "afterLine": "SAMPLE \u00b7 the new way", "beforeImg": "", "afterImg": "", "imgH": 220, "crackAt": 0.9, "top": 260, "centerX": 496, "scale": 1, "outAt": 2.3};
const VV = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};

const N = function(k){ const x = V(k); const n = Number(x); return (x === '' || !isFinite(n)) ? Number(D[k]) : n; };
const Q = function(s){ return document.querySelector(s); };
const QA = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
const wrap = Q('.ab-wrap'), slotR = Q('.ab-r'), slotG = Q('.ab-g');
const cardR = slotR.querySelector('.ab-card'), cardG = slotG.querySelector('.ab-card');
const crack = Q('.ab-crack'), main = QA('.ab-crack .ab-cm'), branches = QA('.ab-crack .ab-cb'), glow = Q('.ab-glow');
const Wd = 840, shift = (432) / 2;
wrap.style.top = N('top') + 'px'; wrap.style.left = (N('centerX') - Wd / 2) + 'px';
gsap.set(wrap, { scale: N('scale'), transformOrigin: '50% 0%' });

// ---- screenshots: blank = no image. A card without one sits next to a card with one -> big status icon fills it.
const hasR = String(V('beforeImg') || '').trim() !== '', hasG = String(V('afterImg') || '').trim() !== '';
const imgH = Math.max(80, N('imgH'));
[[slotR, hasR, hasG], [slotG, hasG, hasR]].forEach(function(r){
  const media = r[0].querySelector('.ab-media'), big = r[0].querySelector('.ab-big'), badge = r[0].querySelector('.ab-badge');
  if (r[1]) { media.style.height = imgH + 'px'; }
  else { media.style.display = 'none'; if (r[2]) { big.style.display = 'flex'; badge.style.visibility = 'hidden'; } }
});
// ---- the two halves of the red card (copies, clipped along the crack); shown only from the break
const pieces = [];
if (!slotR.dataset.done) { slotR.dataset.done = '1';
  ['ab-top', 'ab-bot'].forEach(function(c){ const p = document.createElement('div'); p.className = 'ab-piece ' + c;
    p.appendChild(cardR.cloneNode(true)); slotR.appendChild(p); pieces.push(p); });
}
const top = pieces[0], bot = pieces[1];

const crackAt = Math.max(0.4, N('crackAt')), brk = crackAt + 0.34, outAt = N('outAt');
const parts = [slotR.querySelector('.ab-pill'), slotR.querySelector('.ab-badge'), slotG.querySelector('.ab-pill'), slotG.querySelector('.ab-badge')];
gsap.set([slotR, slotG], { opacity: 0, y: 40 }); gsap.set(parts, { scale: 0.6, opacity: 0 });
gsap.set(pieces, { opacity: 0 }); gsap.set(main.concat(branches), { strokeDasharray: 1, strokeDashoffset: 1 });
gsap.set(glow, { opacity: 0 });
// enter: red first, green 0.09 s later, pills + badges pop
tl.fromTo(slotR, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.36, ease: 'power3.out', immediateRender: false }, 0);
tl.fromTo(slotG, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.36, ease: 'power3.out', immediateRender: false }, 0.09);
parts.forEach(function(p, i){ tl.fromTo(p, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2.6)', immediateRender: false }, 0.16 + i * 0.05); });
// crack: the card jolts, the line runs edge to edge, two short branches split off it
tl.fromTo(cardR, { x: 0 }, { x: -7, duration: 0.04, ease: 'power2.out', immediateRender: false }, crackAt);
tl.fromTo(cardR, { x: -7 }, { x: 6, duration: 0.05, ease: 'power1.inOut', immediateRender: false }, crackAt + 0.04);
tl.fromTo(cardR, { x: 6 }, { x: -3, duration: 0.05, ease: 'power1.inOut', immediateRender: false }, crackAt + 0.09);
tl.fromTo(cardR, { x: -3 }, { x: 0, duration: 0.08, ease: 'power2.out', immediateRender: false }, crackAt + 0.14);
tl.fromTo(main, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.2, ease: 'power2.out', immediateRender: false }, crackAt);
tl.fromTo(branches, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.12, ease: 'power2.out', stagger: 0.04, immediateRender: false }, crackAt + 0.12);
// break: swap the whole card for its two halves (same frame), they pop apart, then fall out of frame
tl.set([cardR, crack], { opacity: 0 }, brk); tl.set(pieces, { opacity: 1 }, brk);
tl.fromTo(top, { x: 0, y: 0, rotation: 0 }, { x: -8, y: -10, rotation: -3, duration: 0.12, ease: 'power2.out', immediateRender: false }, brk);
tl.fromTo(bot, { x: 0, y: 0, rotation: 0 }, { x: 6, y: 8, rotation: 3, duration: 0.12, ease: 'power2.out', immediateRender: false }, brk);
tl.fromTo(top, { x: -8, y: -10, rotation: -3 }, { x: -150, y: 1900, rotation: -26, duration: 0.82, ease: 'power2.in', immediateRender: false }, brk + 0.12);
tl.fromTo(bot, { x: 6, y: 8, rotation: 3 }, { x: 110, y: 1900, rotation: 22, duration: 0.72, ease: 'power2.in', immediateRender: false }, brk + 0.08);
tl.fromTo(pieces, { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, brk + 0.75);
// green card slides to the centre and lands with a glow
const slideAt = brk + 0.14;
tl.fromTo(slotG, { x: 0, scale: 1 }, { x: -shift, scale: 1.05, duration: 0.5, ease: 'power3.inOut', immediateRender: false }, slideAt);
tl.fromTo(glow, { opacity: 0.9, scale: 0.98 }, { opacity: 0, scale: 1.1, duration: 0.5, ease: 'power2.out', immediateRender: false }, slideAt + 0.46);
const gb = slotG.querySelector('.ab-badge'), gbig = slotG.querySelector('.ab-bigc');
tl.fromTo([gb, gbig], { scale: 1 }, { scale: 1.22, duration: 0.1, ease: 'power2.out', immediateRender: false }, slideAt + 0.46);
tl.fromTo([gb, gbig], { scale: 1.22 }, { scale: 1, duration: 0.24, ease: 'back.out(2.4)', immediateRender: false }, slideAt + 0.56);
if (outAt < 98) tl.fromTo(slotG, { opacity: 1, y: 0 }, { opacity: 0, y: -26, duration: 0.24, ease: 'power2.in', immediateRender: false }, Math.max(outAt, slideAt + 0.8));
window.__timelines["ab-split"] = tl;
</script>
