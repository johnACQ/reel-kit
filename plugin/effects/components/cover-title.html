<!doctype html>
<html data-composition-variables='[{"id": "title", "type": "string", "label": "Title", "default": "YOUR HOOK GOES HERE"}, {"id": "tag", "type": "string", "label": "Tag", "default": "Sample tag line"}, {"id": "titleFont", "type": "string", "label": "Title font", "default": "Bebas Neue"}, {"id": "titleCase", "type": "string", "label": "Title case (uppercase/none)", "default": "uppercase"}, {"id": "titleSize", "type": "number", "label": "Title size px", "default": 104}]'>
<head><meta charset="UTF-8" /><!-- reel-kit effect: cover-title. Colours and fonts come from scripts/rebrand.mjs. --></head>
<body>
<template>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&family=Instrument+Serif&display=swap" />
<style>
#root{position:absolute;inset:0;width:100%;height:100%;font-family:Roboto,Arial,sans-serif;color:#0B0F12;}
.card{position:absolute;background:#FFFFFF;border:1px solid rgba(11,15,18,.10);border-radius:18px;box-shadow:0 24px 60px rgba(11,15,18,.28);}
.mono{font-family:'Roboto Mono',monospace;}
.fill{background:#00BEFF;color:#0B0F12;border-radius:10px;padding:0 .18em;}
.wrap{position:absolute;top:230px;left:72px;right:160px;display:flex;flex-direction:column;align-items:center;text-align:center;}
.box{background:#00BEFF;border-radius:10px;padding:16px 30px 12px;font-family:var(--titleFont),'Bebas Neue',sans-serif;text-transform:var(--titleCase);font-size:calc(var(--titleSize) * 1px);line-height:.95;letter-spacing:1px;color:#0B0F12;max-width:860px;}
.tag{margin-top:14px;background:#FFFFFF;border-radius:10px;padding:8px 18px;font:700 30px Roboto,sans-serif;color:#0B0F12;box-shadow:0 10px 30px rgba(11,15,18,.25);}
</style>
<div id="root" data-composition-id="cover-title" data-width="1080" data-height="1920">
<div class="wrap enter"><div class="box" data-var-text="title">YOUR HOOK GOES HERE</div><div class="tag" data-var-text="tag">Sample tag line</div></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const ent = document.querySelectorAll(".enter");  // runtime scopes queries to this mount; an id-prefixed selector finds nothing once a component is mounted twice
if (ent.length) tl.fromTo(ent, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.04);

window.__timelines["cover-title"] = tl;
</script>
</template>
</body>
</html>
