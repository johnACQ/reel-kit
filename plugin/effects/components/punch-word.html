<!doctype html>
<html data-composition-variables='[{"id": "word", "type": "string", "label": "The spoken word", "default": "SKIP"}, {"id": "bg", "type": "enum", "label": "Backdrop", "default": "dark", "options": [{"value": "dark", "label": "dark (#0B0F12)"}, {"value": "cyan", "label": "accent fill, ink word"}, {"value": "none", "label": "none (over the footage)"}]}, {"id": "color", "type": "color", "label": "Word colour (blank = white, or ink on accent)", "default": ""}, {"id": "settle", "type": "number", "label": "First-frame scale, settles to 1 on frame 2 (1 = off)", "default": 1.06, "min": 1, "max": 1.3, "step": 0.01}, {"id": "centerX", "type": "number", "label": "Horizontal centre (px; 540 = true centre, width then capped at 760 so it clears the rail)", "default": 540, "min": 300, "max": 780, "unit": "px"}, {"id": "centerY", "type": "number", "label": "Vertical centre (px)", "default": 860, "min": 500, "max": 1300, "unit": "px"}, {"id": "size", "type": "number", "label": "Type size px (0 = auto: fills the safe width, max 620)", "default": 0, "min": 0, "max": 900, "unit": "px"}]'>
<head><meta charset="UTF-8" /><!-- reel-kit effect: punch-word. Colours and fonts come from scripts/rebrand.mjs. --></head>
<body>
<template>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" />
<style>
@font-face{font-family:'Bebas Neue';font-style:normal;font-weight:400;font-display:block;src:url('compositions/assets/fx_footage/fonts/BebasNeue-400.woff2') format('woff2');}
#root{position:absolute;inset:0;width:100%;height:100%;font-family:Roboto,Arial,sans-serif;color:#0B0F12;}
.pw-bg{position:absolute;inset:0;background:#0B0F12;}
.pw-bg.dark{background:radial-gradient(120% 75% at 46% 44%,#141B21 0%,#0B0F12 64%);}
.pw-bg.cyan{background:#00BEFF;}
.pw-bg.none{display:none;}
.pw-wrap{position:absolute;left:0;top:0;width:1200px;height:900px;display:flex;align-items:center;justify-content:center;}
.pw-word{display:block;font-family:'Bebas Neue',sans-serif;font-weight:400;line-height:.8;padding-top:.1em;letter-spacing:.005em;white-space:nowrap;color:#FFFFFF;}
.pw-word.over{text-shadow:0 10px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.45);}

</style>
<div id="root" data-composition-id="punch-word" data-width="1080" data-height="1920">
<div class="pw-bg dark"></div><div class="pw-wrap"><span class="pw-word">SKIP</span></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const D = {"word": "SKIP", "bg": "dark", "color": "", "settle": 1.06, "centerX": 540, "centerY": 860, "size": 0};
const VV = (window.__hyperframes && window.__hyperframes.getVariables) ? (window.__hyperframes.getVariables() || {}) : {};
const RAW = function(k){ return (VV[k] === undefined || VV[k] === null) ? D[k] : VV[k]; };
const V = function(k){ const x = RAW(k); return String(x).trim() === '' ? D[k] : x; };
const N = function(k){ const x = Number(V(k)); return isFinite(x) ? x : Number(D[k]); };
const B = function(k){ const x = RAW(k); return x === true || x === 'true' || x === 1 || x === '1' || x === 'yes' || x === 'on'; };
const Q = function(s){ return document.querySelector(s); };
const QA = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
const CH = " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~\u2019\u2018\u201c\u201d\u2026\u00b7\u2013\u00e9";
const ADV = {"bebas":[160,210,336,412,400,589,417,188,276,276,422,400,188,270,188,389,400,400,400,400,400,400,400,400,400,400,188,188,400,400,400,363,696,401,404,383,406,363,344,391,420,192,265,414,344,538,427,400,386,400,403,372,364,402,382,557,406,394,362,276,389,276,400,300,500,401,404,383,406,363,344,391,420,192,265,414,344,538,427,400,386,400,403,372,364,402,382,557,406,394,362,276,500,276,400,188,188,336,336,500,188,300,363]};
// width of a string in em, from the real font's advance table (unknown glyphs count as 0.5 em)
const textW = function(str, f){ const t = ADV[f]; let w = 0; Array.from(String(str)).forEach(function(c){ const i = CH.indexOf(c); w += i < 0 ? 500 : t[i]; }); return w / 1000; };
const top = N('top'), cx = N('centerX');
const half = Math.max(160, Math.min(cx - 72, 920 - cx));  // symmetric half-width inside the 72 px side / 160 px rail safe zone

const word = String(V('word')).trim() || 'SAMPLE';
let bg = String(V('bg')).trim().toLowerCase(); if (['dark', 'none', 'cyan'].indexOf(bg) < 0) bg = 'dark';
const col = String(RAW('color') || '').trim() || (bg === 'cyan' ? '#0B0F12' : '#FFFFFF');
let fs = N('size') > 0 ? N('size') : Math.min(620, (half * 2) / (textW(word, 'bebas') * 1.03 + 0.04));
fs = Math.round(fs);
const BG = Q('.pw-bg'), WRAP = Q('.pw-wrap'), WD = Q('.pw-word');
BG.className = 'pw-bg ' + bg;
WRAP.style.left = Math.round(cx - 600) + 'px'; WRAP.style.top = Math.round(N('centerY') - 450) + 'px';
WD.textContent = word; WD.style.fontSize = fs + 'px'; WD.style.color = col;
if (bg === 'none') WD.className = 'pw-word over';
// hard cut in (no fade); optional one-frame scale settle; the host clip's end is the hard cut out
const settle = N('settle');
gsap.set(WD, { scale: settle > 0 ? settle : 1, transformOrigin: '50% 55%' });
tl.set(WD, { scale: 1 }, 1 / 30);

window.__timelines["punch-word"] = tl;
</script>
</template>
</body>
</html>
