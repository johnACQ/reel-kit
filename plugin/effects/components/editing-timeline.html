<script>
const tl = gsap.timeline({ paused: true });
// fallback to the (mount-scoped) document: when a component is mounted twice the runtime renames the root, so the id selector finds nothing
const R = document.querySelector("[data-composition-id='editing-timeline']") || document;
const Q = function(s){ return R.querySelector(s); };
const QA = function(s){ return Array.prototype.slice.call(R.querySelectorAll(s)); };
const D = {"title": "SAMPLE \u00b7 Timeline", "timecodeStart": "00:00:08:00", "sweepDur": 1.0, "tracks": "T1,V2,V1,A1", "clipName": "SAMPLE_take_04"};
const VV = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
const V = function(k){ return (VV[k] === undefined || VV[k] === null || VV[k] === '') ? D[k] : VV[k]; };
const N = function(k){ const x = Number(V(k)); return isFinite(x) ? x : Number(D[k]); };
const panel = Q('.panel'), ph = Q('.ph'), tc = Q('[data-slot="tc"]'), ru = Q('[data-slot="ru"]');
const LW = 748, SPAN = 8, FPS = 30;
const sweep = Math.max(0.4, Math.min(4, N('sweepDur')));
// Track labels from one comma list.
const tr = String(V('tracks')).split(',').map(function(s){ return s.trim(); });
QA('[data-tr]').forEach(function(el, i){ el.textContent = tr[i] !== undefined ? tr[i] : ''; });
// Timecode start -> frames.
const p = String(V('timecodeStart')).split(':').map(function(s){ return parseInt(s, 10) || 0; });
while (p.length < 4) p.unshift(0);
const f0 = ((p[0] * 60 + p[1]) * 60 + p[2]) * FPS + p[3];
const pad = function(x){ return (x < 10 ? '0' : '') + x; };
const tcStr = function(fr){ const ff = fr % FPS, s = Math.floor(fr / FPS), ss = s % 60, mm = Math.floor(s / 60) % 60, hh = Math.floor(s / 3600); return pad(hh) + ':' + pad(mm) + ':' + pad(ss) + ':' + pad(ff); };
// Ruler labels every 2 s.
QA('.rl').forEach(function(el){ el.remove(); });
for (let k = 0; k < SPAN; k += 2) { const l = document.createElement('div'); l.className = 'rl'; l.setAttribute('data-layout-allow-occlusion', ''); l.style.left = (k * LW / SPAN) + 'px'; const s = Math.floor(f0 / FPS) + k; l.textContent = pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); ru.appendChild(l); }
// Timecode readout: one span per displayed value.
tc.textContent = '';
const T0 = 0.5;                       // sweep start
const steps = Math.max(2, Math.round(sweep * FPS));
const tcs = [];
for (let k = 0; k <= steps; k++) { const s = document.createElement('div'); s.className = 'tv'; s.textContent = tcStr(f0 + Math.round(SPAN * FPS * k / steps)); tc.appendChild(s); tcs.push(s); }

const blocksAll = QA('.b');
const wav = QA('.wv i');
// Initial states.
gsap.set(panel, { y: 760 });
gsap.set(tcs, { display: 'none' }); gsap.set(tcs[0], { display: 'block' });
gsap.set(blocksAll, { opacity: 0, x: function(i){ return (i % 2 ? 70 : -70); }, scaleX: 0.82, transformOrigin: '50% 50%' });
gsap.set(wav, { scaleY: 0, transformOrigin: '50% 50%' });
gsap.set(ph, { x: 0, opacity: 0 });

// Slide up from the bottom.
tl.fromTo(panel, { y: 760 }, { y: 0, duration: 0.46, ease: 'power3.out', immediateRender: false }, 0);
// Clips snap in, track by track.
tl.to(blocksAll, { opacity: 1, x: 0, scaleX: 1, duration: 0.3, ease: 'back.out(2.2)', stagger: 0.022 }, 0.08);
tl.to(wav, { scaleY: 1, duration: 0.22, ease: 'power2.out', stagger: { amount: 0.26 } }, 0.14);
// Playhead sweeps; timecode runs; played audio darkens.
tl.to(ph, { opacity: 1, duration: 0.08, ease: 'none' }, T0 - 0.08);
tl.fromTo(ph, { x: 0 }, { x: LW, duration: sweep, ease: 'none', immediateRender: false }, T0);
tcs.forEach(function(s, k){ if (k === 0) return; tl.set(tcs[k - 1], { display: 'none' }, T0 + sweep * k / steps); tl.set(s, { display: 'block' }, T0 + sweep * k / steps); });
wav.forEach(function(b){ const x = parseFloat(b.style.left) || 0; tl.set(b, { backgroundColor: '#0B0F12' }, T0 + sweep * Math.min(1, x / LW)); });
// Slide away.
const out = T0 + sweep + 0.1;
tl.to(panel, { y: 760, duration: 0.32, ease: 'power3.in' }, out);
tl.set({}, {}, out + 0.32);
window.__timelines["editing-timeline"] = tl;
